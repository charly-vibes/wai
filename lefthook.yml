# lefthook.yml - pre-commit/pre-push hooks
#
# Install: lefthook install
# Bypass (WIP only): git push --no-verify
#
# Warning: --no-verify requires:
#   - Commit message MUST contain "WIP" or "wip"
#   - Tests MUST be fixed before merging

pre-commit:
# ah:managed:start
  # ah check runs through the declared-backlog ratchet: the legacy corpus's
  # testless stubs are baselined in scripts/ah-undeclared.txt and every other
  # finding still fails. Raw `ah check` cannot pass until that backlog is paid.
  ah-check:
    run: python3 scripts/ah_check_ratchet.py
# ah:managed:end

  parallel: true
  commands:
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      # ah check via the ratchet (wai-ycr5): the corpus was authored under
      # espectacular 0.2.2, so its 400-odd contract stubs declare no tests.
      # The ratchet allows only that recorded backlog; new findings fail.
      run: python3 scripts/ah_check_ratchet.py
    ddl-pretender-gate:
      run: pretender check --mode gate
    # ddl-spk-lint removed 2026-11-11 (wai-g2iv): spk/specodelic lints
    # specodelic-format specs (frontmatter); this repo's openspec tree has
    # none, so the gate could never pass (exit 2, 'no spec files found').
    # Re-add only after ddl adapts the gate for openspec trees.
    # ddl:managed:end (pre-commit)
    bd:
      run: bd hooks run pre-commit
    format-check:
      glob: "*.rs"
      run: just fmt-check
    lint:
      glob: "*.rs"
      run: just lint
    pretender-check:
      # §9: gate on staged files — blocks NEW violations (testaruda pattern);
      # thresholds come from pretender.toml, tuned to the baseline.
      run: pretender check --staged --mode gate

pre-push:
  commands:
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      # ah check via the declared-backlog ratchet (same gate as pre-commit).
      run: python3 scripts/ah_check_ratchet.py
    # ddl:managed:end (pre-push)
    bd:
      run: bd hooks run pre-push
    test:
      # Run only affected tests via testaruda (falls back to full cargo test)
      # Run only affected tests via testaruda --safe (falls back to cargo test)
      run: testaruda select --safe --base origin/main --head HEAD
      fail_text: |
        Tests failed. Push blocked.

        To bypass (WIP only): git push --no-verify

        Warning: --no-verify requires justification:
        - Commit message MUST contain "WIP" or "wip"
        - You MUST fix tests before merging
