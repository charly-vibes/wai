# lefthook.yml - pre-commit/pre-push hooks
#
# Install: lefthook install
# Bypass (WIP only): git push --no-verify
#
# Warning: --no-verify requires:
#   - Commit message MUST contain "WIP" or "wip"
#   - Tests MUST be fixed before merging

pre-commit:
# ah:managed:start
  ah-check:
    run: ah check
# ah:managed:end

  parallel: true
  commands:
    bd:
      run: bd hooks run pre-commit
    format-check:
      glob: "*.rs"
      run: just fmt-check
    lint:
      glob: "*.rs"
      run: just lint
    pretender-check:
      # §9: gate on staged files — blocks NEW violations (testaruda pattern);
      # thresholds come from pretender.toml, tuned to the baseline.
      run: pretender check --staged --mode gate

pre-push:
  commands:
    bd:
      run: bd hooks run pre-push
    test:
      # Run only affected tests via testaruda (falls back to full cargo test)
      # Run only affected tests via testaruda --safe (falls back to cargo test)
      run: testaruda select --safe --base origin/main --head HEAD
      fail_text: |
        Tests failed. Push blocked.

        To bypass (WIP only): git push --no-verify

        Warning: --no-verify requires justification:
        - Commit message MUST contain "WIP" or "wip"
        - You MUST fix tests before merging
